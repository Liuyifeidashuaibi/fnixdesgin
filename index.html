<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FNIXDESIGN — 品牌官网视觉设计与前端实现。代表作 LUMINA 奢侈品珠宝品牌官网。"
    />
    <title>FNIXDESIGN</title>
    <script>
      // 清理外部来源附带的脏路径、跟踪参数与冗余哈希（如 /foo?spm=...、#work）。
      // #work 是默认路由（无哈希即作品页），保留只会弄脏分享链接；仅 #about 作为有效深链保留。
      (function () {
        var h = window.location.hash;
        var target = "/" + (h === "#about" ? "#about" : "");
        if (
          window.location.pathname !== "/" ||
          window.location.search ||
          window.location.hash !== target
        ) {
          window.history.replaceState(null, "", target);
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <link rel="apple-touch-icon" href="/logo.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root" data-component="app-shell">
      <main
        data-component="loading-state"
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #f3ecdf;
          color: #251b10;
          font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        "
      >
        <p style="font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(37, 27, 16, 0.55)">
          正在加载作品集
        </p>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
